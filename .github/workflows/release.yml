name: Release

# Pushing a tag like v0.1.0 builds the Windows installer and attaches it to a draft
# GitHub release. The draft is published by hand after checking the installer.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $app_version in src-tauri/tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build the installer
        run: npm run desktop:build

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --draft --verify-tag --generate-notes --title "Coffer $GITHUB_REF_NAME"
